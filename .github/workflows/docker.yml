name: docker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 卡住就快速失败，不再烧 6 小时
    steps:
      - uses: actions/checkout@v4

      - name: Build image (without models)
        # runner 下载 306 MB 模型会超时，这里只验证镜像可构建；
        # 模型加载已在 Codespaces 真实环境验证过（见 README 25.6）
        run: docker build --build-arg WITH_MODELS=0 -t kb-bot .

      - name: Run container
        run: docker run -d --name kb -p 8000:8000 kb-bot

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo ""
              echo "OK: service is up"
              exit 0
            fi
            sleep 2
          done
          echo "service did not start"
          docker logs kb
          exit 1

      - name: Show logs
        if: always()
        run: docker logs --tail 50 kb

      - name: Stop container
        if: always()
        run: docker rm -f kb
